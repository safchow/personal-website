# Local MongoDB replica set for the backend e2e test suite only.
# The application database (development + production) is MongoDB Atlas; see
# backend/.env.example and docs/atlas-migration-runbook.md.
services:
  mongodb:
    build:
      context: ./mongodb_replica
      args:
        MONGO_VERSION: 7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
